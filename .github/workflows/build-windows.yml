name: Build Windows Portable EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build renderer and package
        run: |
          npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimi-agent-windows
          path: |
            dist/**
